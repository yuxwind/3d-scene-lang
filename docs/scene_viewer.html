<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSI-Bench Scene Viewer</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc;
  --accent: #2f6fd6; --warn: #b5541c; --canvas: #fbfbf9; --grid: #d9d8d2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --muted: #9a9993; --line: #33322f;
    --accent: #7aa7ff; --warn: #f0a05a; --canvas: #191918; --grid: #3a3936;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --muted: #9a9993; --line: #33322f;
  --accent: #7aa7ff; --warn: #f0a05a; --canvas: #191918; --grid: #3a3936;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
h1 { font-size: 15px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 12px; }
.ctl { padding: 10px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.row { display: flex; gap: 6px; align-items: center; }
label.k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; width: 62px; flex: none; }
select, input[type=search], button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
select, input[type=search] { flex: 1; min-width: 0; }
button { cursor: pointer; }
.seg { display: flex; flex: 1; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 4px 2px; font-size: 12px; }
.seg button.on { background: var(--accent); color: #fff; }
.info { padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 12px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.info dt { color: var(--muted); }
.info dd { margin: 0; font-variant-numeric: tabular-nums; }
.warn { color: var(--warn); }
.objs { overflow: auto; flex: 1; padding: 6px 8px 12px; }
.obj { display: flex; gap: 8px; align-items: center; padding: 3px 8px; border-radius: 5px; cursor: pointer; }
.obj:hover, .obj.sel { background: var(--bg); }
.obj.sel { outline: 1px solid var(--accent); }
.sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.obj .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
main { position: relative; min-width: 0; background: var(--canvas); }
canvas { display: block; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lb { position: absolute; transform: translate(-50%, -100%); font-size: 11px; padding: 1px 5px; border-radius: 4px; white-space: nowrap;
      background: color-mix(in srgb, var(--panel) 82%, transparent); border: 1px solid var(--line); }
.lb.o { font-weight: 600; border-color: var(--accent); }
.legend { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
          padding: 8px 10px; font-size: 11px; color: var(--muted); max-width: calc(100% - 24px); }
.legend b { color: var(--ink); font-weight: 600; }
.ax { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin: 0 3px 0 8px; }
#tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
       font-size: 11px; display: none; font-variant-numeric: tabular-nums; max-width: 320px; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; }
  .objs { max-height: 220px; }
  main { height: 60vh; }
}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="head">
    <h1>VSI-Bench scene viewer</h1>
    <div class="sub">Ground-truth boxes from <code>meta_info</code>, in the reason-190k training frame: origin at the first frame's camera, axes along the room, z up.</div>
  </div>
  <div class="ctl">
    <div class="row"><label class="k">Dataset</label>
      <div class="seg" id="ds"><button data-v="all" class="on">All</button><button data-v="scannet">ScanNet</button><button data-v="scannetpp">ScanNet++</button><button data-v="arkitscenes">ARKit</button></div></div>
    <div class="row"><label class="k">Scene</label><input type="search" id="q" placeholder="filter id…"></div>
    <div class="row"><label class="k"></label><select id="scene"></select><button id="prev" title="previous (←)">‹</button><button id="next" title="next (→)">›</button></div>
    <div class="row"><label class="k">Frame</label>
      <div class="seg" id="frame"><button data-v="new" class="on">Training</button><button data-v="old">VSI-Bench world</button></div></div>
    <div class="row"><label class="k">Boxes</label>
      <div class="seg" id="mode"><button data-v="obb" class="on">9-DoF</button><button data-v="env">Upright AABB</button><button data-v="both">Both</button></div></div>
    <div class="row"><label class="k">Labels</label>
      <div class="seg" id="lab"><button data-v="sel" class="on">Selected</button><button data-v="all">All</button><button data-v="none">None</button></div></div>
  </div>
  <dl class="info" id="info"></dl>
  <div class="objs" id="objs"></div>
</aside>
<main id="main">
  <div id="labels"></div>
  <div id="tip"></div>
  <div class="legend" id="legend"></div>
</main>
</div>

  return m;
}
function envelope(b) {  // eval_scenelang.rvs_scene: upright box around the yaw-rotated footprint
  const c = Math.abs(Math.cos(b[6])), s = Math.abs(Math.sin(b[6]));
  return [b[0], b[1], b[2], b[3] * c + b[4] * s, b[3] * s + b[4] * c, b[5], 0, 0, 0];
}
const unitEdges = new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1));
const unitBox = new THREE.BoxGeometry(1, 1, 1);

function addBox(b, color, dashed, opacity, k) {
  const m = boxMatrix(b).multiply(new THREE.Matrix4().makeScale(Math.max(b[3], 0.01), Math.max(b[4], 0.01), Math.max(b[5], 0.01)));
  const mat = dashed ? new THREE.LineDashedMaterial({ color, dashSize: 0.05, gapSize: 0.04, transparent: true, opacity })
                     : new THREE.LineBasicMaterial({ color, transparent: true, opacity });
  const l = new THREE.LineSegments(unitEdges, mat);
  l.applyMatrix4(m); if (dashed) l.computeLineDistances();
  group.add(l);
  if (!dashed || state.mode === "env") {
    const f = new THREE.Mesh(unitBox, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.07, depthWrite: false }));
    f.applyMatrix4(m); f.userData.k = k; group.add(f); pick.push(f);
  }
  return l;
}

function arrow(dir, color, len) {
  return new THREE.ArrowHelper(new THREE.Vector3(...dir), new THREE.Vector3(0, 0, 0), len, color, len * 0.18, len * 0.09);
}

const cur = () => state.list[state.idx];

function draw(refit) {
  const d = cur(); if (!d) return;
  scene3.remove(group); group = new THREE.Group(); scene3.add(group); pick = []; labelItems = [];
  const objs = d[state.frame];
  const ink = new THREE.Color(css("--ink"));
  let lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  objs.forEach((o, k) => {
    const b = o.slice(1), lab = o[0], col = colOf(lab);
    const selected = state.sel === null || state.sel === lab;
    const op = selected ? 1 : 0.18;
    if (state.mode !== "env") addBox(b, col, false, op, k);
    if (state.mode !== "obb") addBox(envelope(b), col, state.mode === "both", op * (state.mode === "both" ? 0.8 : 1), k);
    const e = envelope(b);
    for (let i = 0; i < 3; i++) { lo[i] = Math.min(lo[i], e[i] - e[i + 3] / 2); hi[i] = Math.max(hi[i], e[i] + e[i + 3] / 2); }
    labelItems.push({ p: new THREE.Vector3(b[0], b[1], b[2] + b[5] / 2), lab, k, on: state.sel === lab });
  });
  // floor grid at the lowest box bottom, spanning the scene
  const span = Math.max(hi[0] - lo[0], hi[1] - lo[1], 2) + 2;
  const grid = new THREE.GridHelper(Math.ceil(span), Math.ceil(span), new THREE.Color(css("--grid")), new THREE.Color(css("--grid")));
  grid.rotation.x = Math.PI / 2;
  grid.position.set((lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, lo[2]);
  group.add(grid);
  // origin: RGB axes (x red, y green, z blue) and a camera marker
  const L = Math.max(0.5, span * 0.08);
  group.add(arrow([1, 0, 0], 0xd94a3d, L), arrow([0, 1, 0], 0x3aa655, L), arrow([0, 0, 1], 0x3d74d9, L));
  const isCam = state.frame === "new" && d.origin === "first_camera";
  const dot = new THREE.Mesh(new THREE.SphereGeometry(L * 0.08, 16, 12), new THREE.MeshBasicMaterial({ color: isCam ? 0xd98b1f : ink }));
  group.add(dot);
  labelItems.push({ p: new THREE.Vector3(0, 0, L * 0.25), lab: isCam ? "first-frame camera (origin)" : "origin (world)", origin: true });
  // a vertical tick from the origin down to the floor shows camera height
  const tick = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, lo[2])]),
    new THREE.LineDashedMaterial({ color: 0xd98b1f, dashSize: 0.06, gapSize: 0.05 }));
  tick.computeLineDistances(); group.add(tick);
  if (refit) {
    const c = new THREE.Vector3((lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2);
    const r = Math.max(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]);
    controls.target.copy(c);
    camera.position.set(c.x - r * 0.9, c.y - r * 1.1, c.z + r * 0.95);
    controls.update();
  }
  info(d, lo, hi);
  objList(d);
  buildLabels();
}

function info(d, lo, hi) {
  const objs = d[state.frame];
  const camH = -lo[2];
  const rows = [
    ["Scene", `${d.ds} / ${d.s}`],
    ["Questions", d.nq],
    ["Objects", `${objs.length} boxes, ${new Set(objs.map(o => o[0])).size} labels`],
    ["Origin", state.frame === "old" ? "VSI-Bench world frame" :
      d.origin === "first_camera" ? "first-frame camera" : `<span class="warn">world (no valid first-frame pose)</span>`],
    ["Room yaw", state.frame === "old" ? "–" : `${d.yaw.toFixed(1)}° removed`],
    ["Extent", `${(hi[0] - lo[0]).toFixed(1)} × ${(hi[1] - lo[1]).toFixed(1)} × ${(hi[2] - lo[2]).toFixed(1)} m`],
    ["Camera h.", state.frame === "new" && d.origin === "first_camera" ? `${camH.toFixed(2)} m above lowest box` : "–"],
  ];
  $("info").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
}

function objList(d) {
  const cnt = {};
  d[state.frame].forEach(o => cnt[o[0]] = (cnt[o[0]] || 0) + 1);
  $("objs").innerHTML = Object.keys(cnt).sort().map(l =>
    `<div class="obj${state.sel === l ? " sel" : ""}" data-l="${l.replace(/"/g, "&quot;")}"><span class="sw" style="background:#${colOf(l).getHexString()}"></span>${l}<span class="n">${cnt[l]}</span></div>`).join("");
}
$("objs").addEventListener("click", e => {
  const el = e.target.closest(".obj"); if (!el) return;
  state.sel = state.sel === el.dataset.l ? null : el.dataset.l; draw(false);
});

function buildLabels() {
  const box = $("labels"); box.innerHTML = "";
  for (const it of labelItems) {
    const show = it.origin || state.lab === "all" || (state.lab === "sel" && state.sel === it.lab);
    if (!show) { it.el = null; continue; }
    const el = document.createElement("div"); el.className = "lb" + (it.origin ? " o" : ""); el.textContent = it.lab;
    box.appendChild(el); it.el = el;
  }
}
function placeLabels() {
  const w = main.clientWidth, h = main.clientHeight;
  for (const it of labelItems) {
    if (!it.el) continue;
    const v = it.p.clone().project(camera);
    const vis = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
    it.el.style.display = vis ? "" : "none";
    it.el.style.left = ((v.x + 1) / 2 * w) + "px"; it.el.style.top = ((1 - v.y) / 2 * h - 4) + "px";
  }
}

// hover tooltip
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
renderer.domElement.addEventListener("pointermove", e => {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(pick)[0], tip = $("tip");
  if (!hit) { tip.style.display = "none"; return; }
  const o = cur()[state.frame][hit.object.userData.k], b = o.slice(1), f = v => v.toFixed(2);
  const en = envelope(b);
  tip.innerHTML = `<b>${o[0]}</b><br>centre ${f(b[0])}, ${f(b[1])}, ${f(b[2])}<br>size ${f(b[3])} × ${f(b[4])} × ${f(b[5])}<br>` +
    `yaw ${(b[6] * 180 / Math.PI).toFixed(1)}°, roll ${(b[7] * 180 / Math.PI).toFixed(1)}°, pitch ${(b[8] * 180 / Math.PI).toFixed(1)}°<br>` +
    `<span style="color:var(--muted)">upright AABB ${f(en[3])} × ${f(en[4])} × ${f(en[5])}</span>`;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 330) + "px"; tip.style.top = (e.clientY - r.top + 14) + "px";
});
renderer.domElement.addEventListener("pointerleave", () => $("tip").style.display = "none");
renderer.domElement.addEventListener("click", () => {
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(pick)[0];
  const lab = hit ? cur()[state.frame][hit.object.userData.k][0] : null;
  state.sel = state.sel === lab ? null : lab; draw(false);
});

function legend() {
  $("legend").innerHTML = `<b>Axes</b><span class="ax" style="background:#d94a3d"></span>x<span class="ax" style="background:#3aa655"></span>y` +
    `<span class="ax" style="background:#3d74d9"></span>z (up) · grid at the lowest box bottom, 1 m · ` +
    (state.mode === "obb" ? "solid = 9-DoF GT box" : state.mode === "env" ? "upright AABB = what sr-q35vs sees" : "solid = 9-DoF, dashed = upright AABB") +
    ` · drag to orbit, right-drag to pan, scroll to zoom`;
}

function refreshList(keepScene) {
  const q = $("q").value.trim().toLowerCase();
  const prev = keepScene || (cur() && cur().s);
  state.list = DATA.filter(d => (state.ds === "all" || d.ds === state.ds) && (!q || d.s.toLowerCase().includes(q)));
  $("scene").innerHTML = state.list.map((d, i) => `<option value="${i}">${d.s} · ${d.ds}${d.origin === "world" ? " (world origin)" : ""}</option>`).join("");
  const j = state.list.findIndex(d => d.s === prev);
  state.idx = j >= 0 ? j : 0; $("scene").value = state.idx;
  state.sel = null; draw(true);
}
function seg(id, key, after) {
  const el = $(id);
  el.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === state[key]));
  el.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state[key] = b.dataset.v; el.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    after(); save();
  });
}
seg("ds", "ds", () => refreshList());
seg("frame", "frame", () => draw(true));
seg("mode", "mode", () => { legend(); draw(false); });
seg("lab", "lab", () => buildLabels());
$("q").addEventListener("input", () => refreshList());
$("scene").addEventListener("change", e => { state.idx = +e.target.value; state.sel = null; draw(true); save(); });
const step = k => { if (!state.list.length) return; state.idx = (state.idx + k + state.list.length) % state.list.length; $("scene").value = state.idx; state.sel = null; draw(true); save(); };
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); });

function resize() {
  const w = main.clientWidth, h = main.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(main);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { scene3.background = new THREE.Color(css("--canvas")); draw(false); });
scene3.background = new THREE.Color(css("--canvas"));
resize(); legend();
let saved = null; try { saved = JSON.parse(localStorage.getItem("svw") || "{}").s; } catch (e) {}
refreshList(saved);
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene3, camera); placeLabels(); })();
</script>
</body>
</html>
